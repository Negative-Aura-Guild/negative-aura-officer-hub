<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logs — Negative Aura</title>
<link rel="stylesheet" href="../assets/hub.css">
</head>
<body>
<div class="wrap">
  <nav class="hubnav">
    <a href="../index.html" class="brand"><span class="s">&#10023;</span> Negative Aura</a>
    <a href="roster.html">Roster</a>
    <a href="loot.html">Loot Tracking</a>
    <a href="logs.html" class="active">Logs</a>
    <a href="recruitment.html">Recruitment</a>
  </nav>
  <div class="page-head">
    <span class="sigil">&#10023;</span>
    <h1>Logs</h1>
    <span class="updated">loading…</span>
  </div>
  <div id="content">
    <div class="loading">Loading reports…</div>
  </div>
  <footer class="hub">From the WarcraftLogs API. Refreshed hourly.</footer>
</div>

<script src="../assets/hub.js"></script>
<script>
(function () {
  var H = window.NAHub;

  H.boot({
    render: function (meta) {
      H.loadJSON("../data/logs.json").then(function (data) {
        var content = document.getElementById("content");
        var reports = (data.reports || []).map(function (r) {
          return {
            date: H.fmtDateFromEpoch(r.start),
            title: r.title || "(untitled)",
            zone: r.zone || "",
            duration: r.durationMin,
            owner: r.owner || "",
            url: r.url
          };
        });

        content.innerHTML =
          '<div class="card">' +
          '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">' +
            '<h2 style="margin:0">Recent raid reports</h2>' +
            '<a class="btn ghost" style="margin-left:auto" target="_blank" rel="noopener" href="' +
              H.esc(data.guildPage) + '">Open full history on WarcraftLogs &rarr;</a>' +
          '</div>' +
          '<div id="tbl"></div></div>';

        if (!reports.length) {
          document.getElementById("tbl").innerHTML = '<div class="notice">No reports returned' +
            (meta.sources && meta.sources.logs && meta.sources.logs !== "ok"
              ? " (source status: " + H.esc(meta.sources.logs) + ")" : "") + '.</div>';
          return;
        }

        var t = H.renderTable(document.getElementById("tbl"), {
          filter: true,
          pageSize: 25,
          controls: 'From <input type="date" id="from"> to <input type="date" id="to">' +
                    ' <button class="tbl-pg" id="clr">Clear</button>',
          defaultSortKey: "date",
          defaultSortDir: -1,
          emptyText: "No reports in that range.",
          columns: [
            { key: "date", label: "Date", sort: "date", cls: "faint" },
            { key: "title", label: "Report", sort: "text",
              render: function (v, r) { return '<a target="_blank" rel="noopener" href="' + H.esc(r.url) + '">' + H.esc(v) + '</a>'; } },
            { key: "zone", label: "Zone", sort: "text", cls: "faint" },
            { key: "duration", label: "Length", sort: "num",
              render: function (v) { return v != null ? v + " min" : ""; } },
            { key: "owner", label: "By", sort: "text", cls: "faint" }
          ],
          rows: reports
        });

        var from = document.getElementById("from");
        var to = document.getElementById("to");
        function apply() {
          var f = from.value, tt = to.value;
          if (!f && !tt) { t.setFilter(null); return; }
          t.setFilter(function (r) {
            return (!f || r.date >= f) && (!tt || r.date <= tt);
          });
        }
        from.addEventListener("change", apply);
        to.addEventListener("change", apply);
        document.getElementById("clr").addEventListener("click", function () {
          from.value = ""; to.value = ""; t.setFilter(null);
        });
      }).catch(function (e) {
        document.getElementById("content").innerHTML =
          '<div class="notice err">Could not load logs.json — ' + H.esc(e.message) + '</div>';
      });
    }
  });
})();
</script>
</body>
</html>
